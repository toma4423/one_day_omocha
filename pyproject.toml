[project]
name = "one-day-omocha"
version = "0.1.0"
description = "A collection of small games and tools using Streamlit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.2",
    "pillow>=12.1.1",
    "streamlit>=1.54.0",
    "streamlit-local-storage>=0.0.25",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9.7",
    "mypy>=1.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701"] # Ignore line length and single-line statements for streamlit UI brevity

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E712"] # Allow '== True' in tests for clarity

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests"]
